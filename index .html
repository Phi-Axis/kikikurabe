<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5E9CE;
    --panel: #FFFBF2;
    --panel-2: #F1DFB5;
    --groove: #ECD9A9;
    --amber: #C8352B;
    --amber-dim: #8F2A1D;
    --green: #3B6B4A;
    --green-dim: #D8E8DC;
    --text: #3B2A1D;
    --text-muted: #9C8265;
    --red: #9C3B2A;
    --ko-font: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(circle at 50% -10%, #FFFFFF 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:16px 10px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .deck{
    width:100%;
    max-width:480px;
    background:var(--panel);
    border-radius:18px;
    border:1px solid #F5D9B8;
    box-shadow:0 24px 50px -18px rgba(150,100,50,0.28), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  @media (max-width:420px){
    body{ padding:10px 6px calc(20px + env(safe-area-inset-bottom)); }
    .deck{ border-radius:14px; }
    .brand{ padding:14px 16px 0; }
    .reel-bay{ padding:16px 44px 6px; }
    .reel{ width:60px; height:60px; }
    .tape-path{ left:74px; right:74px; }
    .window{ margin:6px 16px 14px; padding:12px 14px; }
    .section{ padding:12px 16px; }
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:16px 20px 0;
  }
  .brand .name{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    letter-spacing:0.08em;
    font-size:18px;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  .brand .model{
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--amber-dim);
  }

  /* Reels：見本再生中・録音中はどちらも回る（テープレコーダーの見立て） */
  .reel-bay{
    position:relative;
    padding:22px 56px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .tape-path{
    position:absolute;
    left:92px; right:92px; top:52%;
    height:2px;
    background:linear-gradient(90deg, transparent, #F0C68F 15%, #F0C68F 85%, transparent);
    z-index:0;
  }
  .reel{
    width:76px; height:76px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, var(--groove) 0 18%, #FFD9AE 19% 32%, var(--groove) 33% 100%);
    position:relative;
    z-index:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px #F0C494, 0 6px 14px rgba(150,100,50,0.18);
    animation: spin 3s linear infinite;
    animation-play-state: paused;
  }
  .reel.spinning{ animation-play-state: running; }
  .reel.rec{ box-shadow: inset 0 0 0 1px #F0C494, 0 0 0 4px rgba(200,53,43,0.25), 0 6px 14px rgba(150,100,50,0.18); }
  .reel::before{
    content:'';
    position:absolute;
    width:100%; height:100%;
    border-radius:50%;
    background:
      conic-gradient(from 0deg,
        transparent 0 10deg, #E8A65E 10deg 14deg,
        transparent 14deg 100deg, #E8A65E 100deg 104deg,
        transparent 104deg 190deg, #E8A65E 190deg 194deg,
        transparent 194deg 280deg, #E8A65E 280deg 284deg,
        transparent 284deg 360deg);
  }
  .reel .hub{
    width:14px; height:14px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px rgba(200,53,43,0.5);
    z-index:2;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Window：ファイル名 + タイマー表示 */
  .window{
    margin:6px 20px 18px;
    background:var(--groove);
    border-radius:10px;
    padding:14px 16px;
    border:1px solid #F2DEC0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .track-name{
    font-size:19px;
    font-weight:600;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .track-name.empty{ color:var(--text-muted); }
  .counter{
    font-family:'Space Mono', monospace;
    font-size:28px;
    font-weight:700;
    letter-spacing:0.05em;
    color:var(--amber);
    text-shadow:0 0 10px rgba(200,53,43,0.35);
    flex-shrink:0;
  }
  .counter.rec{ animation: blink 1s step-start infinite; }
  @keyframes blink{ 50%{ opacity:.35; } }
  .counter-label{
    font-family:'Fredoka', sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.12em;
    color:var(--text-muted);
    text-transform:uppercase;
    display:block;
    text-align:right;
  }

  /* Sections */
  .section{
    padding:14px 20px;
    border-top:1px solid #F2DEC0;
  }
  .section-label{
    font-family:'Fredoka', sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.1em;
    color:var(--text-muted);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .section-label-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .section-label-row .section-label{ margin-bottom:0; }
  .eye-btn{
    width:34px; height:34px;
    border-radius:8px;
    border:1px solid #F0C68F;
    background:var(--panel-2);
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    padding:0;
  }
  .eye-btn svg{ width:17px; height:17px; }
  .eye-btn:active{ transform:scale(0.92); }
  .eye-btn.active{
    color:var(--green);
    border-color:var(--green);
    background:rgba(59,107,74,0.1);
  }

  /* 台本：入力欄 */
  #scriptArea{
    width:100%;
    min-height:260px;
    resize:none;
    overflow:hidden;
    -webkit-appearance:none;
    appearance:none;
    background:var(--groove);
    border:1px solid #F2DEC0;
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:var(--ko-font);
    font-size:16px;
    line-height:1.8;
    outline:none;
  }
  #scriptArea:focus{ border-color:var(--amber-dim); }
  #scriptArea::placeholder{ color:var(--text-muted); font-family:'Noto Sans JP', sans-serif; }

  /* 台本：常に全文を表示する大きな読み取り用ビュー（崩れない） */
  .script-view{
    background:var(--groove);
    border:1px solid #F2DEC0;
    border-radius:10px;
    padding:16px 16px;
    min-height:160px;
  }
  #scriptFull{
    font-family:var(--ko-font);
    font-weight:500;
    font-size:clamp(21px,5.8vw,28px);
    line-height:2;
    color:var(--text);
    white-space:pre-wrap;
    overflow-wrap:break-word;
    -webkit-user-select:text;
    user-select:text;
  }

  /* 音声：共通ドロップゾーン */
  .dropzone{
    border:1.5px dashed #F0C68F;
    border-radius:10px;
    padding:20px 16px;
    min-height:48px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s, background 0.15s;
    font-size:16px;
    line-height:1.5;
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--amber);
    background:rgba(200,53,43,0.08);
    color:var(--text);
  }
  .dropzone:active{ background:rgba(200,53,43,0.1); }
  .dropzone input{ display:none; }

  .big-dropzone{
    flex-direction:column;
    gap:10px;
    padding:28px 16px;
    min-height:100px;
    border-width:2px;
    border-radius:14px;
    margin-bottom:12px;
  }
  .dropzone-icon{
    width:34px; height:34px;
    color:var(--amber);
    flex-shrink:0;
  }
  .dropzone-label{
    font-family:'Fredoka', sans-serif;
    font-size:17px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--text);
    text-align:center;
    line-height:1.4;
    max-width:270px;
  }

  /* 大きなボタン（共通） */
  .btn-big{
    width:100%;
    min-height:64px;
    border:none;
    border-radius:16px;
    font-family:'Noto Sans JP', sans-serif;
    font-size:21px;
    font-weight:700;
    letter-spacing:0.04em;
    cursor:pointer;
    transition:transform 0.1s, filter 0.15s, box-shadow 0.2s;
    -webkit-user-select:none; user-select:none;
    display:flex; align-items:center; justify-content:center;
    gap:8px;
  }
  .btn-big:active{ transform:scale(0.98); }
  .btn-big:disabled{ opacity:.4; cursor:default; transform:none; filter:none; }

  .btn-sample{
    background:var(--panel-2);
    color:var(--amber-dim);
    border:1.5px solid #E8C78F;
  }
  .btn-sample:not(:disabled):hover{ border-color:var(--amber); }
  .btn-sample.playing{
    background:var(--amber);
    color:#fff;
    border-color:var(--amber);
    box-shadow:0 6px 18px rgba(200,53,43,0.28);
  }

  /* 録音ボタン：押せる領域は大きいまま、中の表示は「● 録音する」とコンパクトにする */
  .btn-record{
    background:var(--amber);
    color:#fff;
    box-shadow:0 8px 24px rgba(200,53,43,0.32);
    flex-direction:row;
    gap:12px;
    min-height:192px;
    border-radius:28px;
  }
  .btn-record:not(:disabled):hover{ filter:brightness(1.06); }
  .btn-record.recording{
    background:#A82A20;
    animation: recPulse 1.4s ease-in-out infinite;
  }
  @keyframes recPulse{
    0%,100%{ box-shadow:0 8px 24px rgba(200,53,43,0.32), 0 0 0 0 rgba(200,53,43,0.4); }
    50%{ box-shadow:0 8px 24px rgba(200,53,43,0.32), 0 0 0 14px rgba(200,53,43,0); }
  }
  .rec-icon{
    width:20px; height:20px;
    border-radius:50%;
    background:#fff;
    flex-shrink:0;
    transition:border-radius 0.25s ease, width 0.25s ease, height 0.25s ease;
  }
  .btn-record.recording .rec-icon{
    width:16px; height:16px;
    border-radius:5px;
  }
  .rec-label{
    font-size:28px;
    font-weight:700;
    letter-spacing:0.04em;
  }

  .btn-playback{
    background:var(--green);
    color:#fff;
    box-shadow:0 6px 18px rgba(59,107,74,0.28);
  }
  .btn-playback:not(:disabled):hover{ filter:brightness(1.08); }
  .btn-playback.playing{ background:#2B4F37; }

  .rec-note{
    text-align:center;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--amber);
    padding-bottom:10px;
    font-family:'Space Mono', monospace;
    min-height:1.3em;
  }
  .rec-note:empty{ visibility:hidden; }

  .hint{
    font-size:13px;
    color:var(--text-muted);
    text-align:center;
    margin-top:10px;
    line-height:1.6;
  }

  .playback-wrap{
    margin-top:12px;
  }

  /* 見本ファイル選択後のコンパクト表示（選択エリアを占有し続けないようにする） */
  .sample-compact{
    display:flex; align-items:center; gap:10px;
    background:var(--panel-2);
    border:1px solid #E8C78F;
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:12px;
  }
  .sample-compact svg{ width:20px; height:20px; color:var(--amber); flex-shrink:0; }
  .sample-compact .name{
    flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:14px; color:var(--text);
  }
  .sample-compact .change-btn{
    font-size:13px;
    color:var(--amber-dim);
    background:none;
    border:1px solid #E8C78F;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    flex-shrink:0;
  }
  .sample-compact .change-btn:active{ background:rgba(200,53,43,0.08); }

  .status-bar{
    display:flex; align-items:center; gap:6px;
    justify-content:center;
    padding:14px 20px 18px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--text-muted);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-muted);
  }
  .dot.live{ background:var(--green); box-shadow:0 0 6px var(--green); }
  .dot.rec{ background:var(--amber); box-shadow:0 0 6px var(--amber); }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .reel{ animation:none; }
    .btn-record.recording{ animation:none; }
  }
</style>
</head>
<body>

<div class="deck">
  <div class="brand">
    <span class="name">聞きくらべ</span>
    <span class="model">MODEL KK-1</span>
  </div>

  <div class="reel-bay">
    <div class="tape-path"></div>
    <div class="reel" id="reelL"><div class="hub"></div></div>
    <div class="reel" id="reelR"><div class="hub"></div></div>
  </div>

  <div class="window">
    <div class="track-name empty" id="trackName">見本ファイル未選択</div>
    <div>
      <span class="counter-label" id="counterLabel">REC</span>
      <span class="counter" id="counterVal">0:00</span>
    </div>
  </div>

  <!-- 見本音声 -->
  <div class="section">
    <div class="section-label">見本音声</div>
    <label class="dropzone big-dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropzone-icon"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="dropzone-label">見本音声をドラッグ&ドロップ、またはタップして選ぶ</span>
      <input type="file" id="fileInput" accept=".mp3,.m4a,.wav,.aac,.aiff,.ogg,audio/*">
    </label>
    <div class="sample-compact hidden" id="sampleCompact">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="name" id="sampleName"></span>
      <button type="button" class="change-btn" id="changeSampleBtn">変更</button>
    </div>
    <button class="btn-big btn-sample" id="sampleBtn" disabled>▶︎ 見本を聴く</button>
  </div>

  <!-- 台本 -->
  <div class="section script-section">
    <div class="section-label-row">
      <div class="section-label">台本</div>
      <button class="eye-btn active" id="editBtn" title="台本を確定">
        <svg id="editIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>

    <textarea id="scriptArea" placeholder="ここに台本を貼り付けてください" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" lang="ko"></textarea>

    <div class="script-view hidden" id="scriptView">
      <div id="scriptFull" lang="ko"></div>
    </div>
  </div>

  <!-- 録音 -->
  <div class="section">
    <div class="section-label">録音</div>
    <div class="rec-note" id="recNote"></div>
    <button class="btn-big btn-record" id="recordBtn">
      <span class="rec-icon" id="recIcon"></span>
      <span class="rec-label" id="recLabel">録音する</span>
    </button>
    <div class="playback-wrap hidden" id="playbackWrap">
      <button class="btn-big btn-playback" id="playbackBtn">▶︎ 自分の声を聞く</button>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">待機中</span>
  </div>
</div>

<audio id="sampleAudio" playsinline></audio>
<audio id="recordedAudio" playsinline></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);

  /* =====================================================
     台本：常に全文表示（崩れる機能なし）
     ===================================================== */
  const scriptArea = $('scriptArea'), scriptView = $('scriptView'), scriptFull = $('scriptFull');
  const editBtn = $('editBtn'), editIcon = $('editIcon');
  const ICON_CHECK = '<path d="M20 6L9 17l-5-5"/>';
  const ICON_PENCIL = '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>';
  let scriptMode = 'edit';

  function autoGrow(){
    scriptArea.style.height = 'auto';
    scriptArea.style.height = scriptArea.scrollHeight + 'px';
  }
  scriptArea.addEventListener('input', autoGrow);
  window.addEventListener('resize', autoGrow);
  autoGrow();

  function showScript(){
    const text = scriptArea.value.normalize('NFC').replace(/\r\n?/g, '\n').replace(/\s+$/, '');
    if (text.trim() === '') return;
    scriptFull.textContent = text;   // 改行はCSSのwhite-space:pre-wrapでそのまま保持
    scriptMode = 'view';
    scriptArea.classList.add('hidden');
    scriptView.classList.remove('hidden');
    editIcon.innerHTML = ICON_PENCIL;
    editBtn.classList.remove('active');
    editBtn.title = '台本を編集';
  }
  function editScript(){
    scriptMode = 'edit';
    scriptArea.classList.remove('hidden');
    scriptView.classList.add('hidden');
    editIcon.innerHTML = ICON_CHECK;
    editBtn.classList.add('active');
    editBtn.title = '台本を確定';
    autoGrow();
  }
  editBtn.addEventListener('click', () => { scriptMode === 'edit' ? showScript() : editScript(); });

  /* =====================================================
     見本音声（端末内のファイルのみ・外部送信なし）
     ===================================================== */
  const sampleAudio = $('sampleAudio');
  const fileInput = $('fileInput'), dropzone = $('dropzone');
  const sampleCompact = $('sampleCompact'), sampleName = $('sampleName'), changeSampleBtn = $('changeSampleBtn');
  const trackName = $('trackName');
  const sampleBtn = $('sampleBtn');
  const reelL = $('reelL'), reelR = $('reelR');
  const statusDot = $('statusDot'), statusText = $('statusText');
  const counterVal = $('counterVal'), counterLabel = $('counterLabel');

  const AUDIO_EXT_RE = /\.(mp3|m4a|wav|aac|aiff|aif|ogg|oga|flac|wma|opus)$/i;
  let sampleURL = null;
  let sampleIsPlaying = false;

  function setStatus(state){
    if (state === 'sample'){
      statusDot.className = 'dot live';
      statusText.textContent = '見本を再生中';
    } else if (state === 'rec'){
      statusDot.className = 'dot rec';
      statusText.textContent = '録音中';
    } else if (state === 'own'){
      statusDot.className = 'dot live';
      statusText.textContent = '自分の声を再生中';
    } else {
      statusDot.className = 'dot';
      statusText.textContent = '待機中';
    }
  }

  function setSpin(on){
    reelL.classList.toggle('spinning', on);
    reelR.classList.toggle('spinning', on);
  }
  function setReelRec(on){
    reelL.classList.toggle('rec', on);
    reelR.classList.toggle('rec', on);
  }

  function addSampleFile(fileList){
    const f = Array.from(fileList).find(f => (f.type && f.type.startsWith('audio/')) || AUDIO_EXT_RE.test(f.name));
    if (!f) return;
    sampleAudio.pause();
    if (sampleURL) URL.revokeObjectURL(sampleURL);
    sampleURL = URL.createObjectURL(f);
    sampleAudio.src = sampleURL;
    sampleIsPlaying = false;
    updateSampleBtn();
    trackName.textContent = f.name;
    trackName.classList.remove('empty');
    sampleBtn.disabled = false;

    // 選択エリアをコンパクトにして、聴くボタンを主役にする
    dropzone.classList.add('hidden');
    sampleName.textContent = f.name;
    sampleCompact.classList.remove('hidden');
  }

  function updateSampleBtn(){
    sampleBtn.textContent = sampleIsPlaying ? '⏸ 見本を止める' : '▶︎ 見本を聴く';
    sampleBtn.classList.toggle('playing', sampleIsPlaying);
  }

  function playSample(){
    if (!sampleAudio.src || isRecording) return;
    stopOwnPlayback();
    if (sampleAudio.ended || sampleAudio.currentTime >= (sampleAudio.duration || 0)) sampleAudio.currentTime = 0;
    sampleAudio.play().then(() => {
      sampleIsPlaying = true;
      updateSampleBtn();
      setSpin(true);
      setStatus('sample');
    }).catch(() => {});
  }
  function pauseSample(){
    sampleAudio.pause();
    sampleIsPlaying = false;
    updateSampleBtn();
    setSpin(isRecording);
    if (!isRecording) setStatus('idle');
  }
  function stopSamplePlayback(){ if (sampleIsPlaying) pauseSample(); }

  sampleBtn.addEventListener('click', () => {
    if (sampleIsPlaying) pauseSample(); else playSample();
  });
  sampleAudio.addEventListener('ended', () => {
    sampleIsPlaying = false;
    updateSampleBtn();
    setSpin(isRecording);
    if (!isRecording) setStatus('idle');
    sampleAudio.currentTime = 0;
  });

  fileInput.addEventListener('change', e => addSampleFile(e.target.files));
  ['dragover','dragenter'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', e => { if (e.dataTransfer.files.length) addSampleFile(e.dataTransfer.files); });
  changeSampleBtn.addEventListener('click', () => fileInput.click());

  /* =====================================================
     録音（ブラウザ標準のMediaRecorder。外部送信・保存なし）
     ===================================================== */
  const recordBtn = $('recordBtn');
  const recLabel = $('recLabel');
  const recNote = $('recNote');
  const playbackWrap = $('playbackWrap');
  const playbackBtn = $('playbackBtn');
  const recordedAudio = $('recordedAudio');

  const MAX_MS = 3 * 60 * 1000;   // 最大3分で自動停止
  let mediaRecorder = null;
  let micStream = null;
  let chunks = [];
  let isRecording = false;
  let recStartedAt = 0;
  let recTimerId = null;
  let autoStopId = null;
  let recordedURL = null;
  let ownIsPlaying = false;

  function fmtTime(ms){
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function pickMimeType(){
    const candidates = [
      'audio/mp4',
      'audio/aac',
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus'
    ];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    for (const t of candidates) { if (MediaRecorder.isTypeSupported(t)) return t; }
    return '';
  }

  function stopOwnPlayback(){
    if (ownIsPlaying){
      recordedAudio.pause();
      ownIsPlaying = false;
      updatePlaybackBtn();
      if (!isRecording && !sampleIsPlaying) setStatus('idle');
    }
  }

  function updatePlaybackBtn(){
    playbackBtn.textContent = ownIsPlaying ? '⏸ 止める' : '▶︎ 自分の声を聞く';
    playbackBtn.classList.toggle('playing', ownIsPlaying);
  }

  playbackBtn.addEventListener('click', () => {
    if (isRecording) return;
    if (ownIsPlaying){ stopOwnPlayback(); return; }
    stopSamplePlayback();
    if (recordedAudio.ended) recordedAudio.currentTime = 0;
    recordedAudio.play().then(() => {
      ownIsPlaying = true;
      updatePlaybackBtn();
      setStatus('own');
    }).catch(() => {});
  });
  recordedAudio.addEventListener('ended', () => {
    ownIsPlaying = false;
    updatePlaybackBtn();
    if (!isRecording && !sampleIsPlaying) setStatus('idle');
    recordedAudio.currentTime = 0;
  });

  function tickTimer(){
    const elapsed = Date.now() - recStartedAt;
    counterVal.textContent = fmtTime(Math.min(elapsed, MAX_MS));
    recNote.textContent = '🎙️ ' + fmtTime(Math.min(elapsed, MAX_MS));
  }

  async function startRecording(){
    if (isRecording) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      recNote.textContent = 'この端末・ブラウザでは録音機能が使用できません。';
      return;
    }
    // 見本音声・自分の声の再生が鳴っていたら止めてから録音開始（確認ダイアログは出さない）
    stopSamplePlayback();
    stopOwnPlayback();
    playbackWrap.classList.add('hidden');

    try{
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err){
      recNote.textContent = 'マイクの使用が許可されていません。設定でマイクへのアクセスを確認してください。';
      return;
    }

    const mimeType = pickMimeType();
    try{
      mediaRecorder = mimeType ? new MediaRecorder(micStream, { mimeType }) : new MediaRecorder(micStream);
    } catch (err){
      mediaRecorder = new MediaRecorder(micStream);
    }
    chunks = [];
    mediaRecorder.addEventListener('dataavailable', e => { if (e.data && e.data.size > 0) chunks.push(e.data); });
    mediaRecorder.addEventListener('stop', onRecordingStopped);

    mediaRecorder.start();
    isRecording = true;
    recStartedAt = Date.now();
    counterLabel.textContent = 'REC';
    counterVal.classList.add('rec');
    tickTimer();
    recTimerId = setInterval(tickTimer, 500);
    autoStopId = setTimeout(stopRecording, MAX_MS);

    recLabel.textContent = '録音を止める';
    recordBtn.classList.add('recording');
    sampleBtn.disabled = true;
    setSpin(true);
    setReelRec(true);
    setStatus('rec');
  }

  function stopRecording(){
    if (!isRecording || !mediaRecorder) return;
    clearInterval(recTimerId); recTimerId = null;
    clearTimeout(autoStopId); autoStopId = null;
    isRecording = false;
    try { mediaRecorder.stop(); } catch (e) {}
  }

  function onRecordingStopped(){
    // マイクを解放
    if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }

    const type = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
    const blob = new Blob(chunks, { type });
    chunks = [];

    if (recordedURL) URL.revokeObjectURL(recordedURL);   // 前の録音は破棄
    recordedURL = URL.createObjectURL(blob);
    recordedAudio.src = recordedURL;

    recLabel.textContent = '録音する';
    recordBtn.classList.remove('recording');
    sampleBtn.disabled = !sampleAudio.src;
    counterVal.classList.remove('rec');
    recNote.textContent = '';
    setSpin(sampleIsPlaying);
    setReelRec(false);
    setStatus('idle');

    playbackWrap.classList.remove('hidden');
    updatePlaybackBtn();
  }

  recordBtn.addEventListener('click', () => {
    if (isRecording) stopRecording(); else startRecording();
  });
})();
</script>
</body>
</html>
